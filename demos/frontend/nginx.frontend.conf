# 前端容器内 Nginx 配置（由 deploy/Dockerfile.frontend 拷入）
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 2M 带宽下，gzip 是首屏速度的命门
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # SPA 路由回退：任何找不到的路径都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 入口文件不缓存，保证发版后用户立刻拿到新资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
