# 本地 Jenkins（CI 机）——第 03 章使用
# 启动：docker compose -f pipelines/jenkins/docker-compose.jenkins.yml up -d
# 停止：docker compose -f pipelines/jenkins/docker-compose.jenkins.yml down
# 数据在命名卷 jenkins-home 里，down 不会丢；只有 down -v 才会删（危险）
services:
  jenkins:
    # 第 15 章起改用带工具的自定义镜像（Dockerfile.jenkins），首次启动要 --build
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: cicd-jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    # 用 root 跑是为了避开 Windows 卷权限问题；企业环境应指定 uid:gid
    user: root
    ports:
      - "8080:8080"   # Web UI
      - "50000:50000" # Agent 通信（第 17 章自建 Agent 用）
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: >-
        -Duser.timezone=Asia/Shanghai
        -Dfile.encoding=UTF-8
        -Xmx768m
        -XX:MaxMetaspaceSize=256m
        -Dhudson.model.DownloadService.noSignatureCheck=true
    volumes:
      - jenkins-home:/var/jenkins_home
      # 流水线构建镜像：复用宿主 Docker 守护进程
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主机 SSH 密钥挂到 /host-ssh（只读），启动后复制进 /var/jenkins_home/.ssh 并改权限，
      # 命令见第 15 章步骤 6。Mac/Linux 把 USERPROFILE 行换成 ~/.ssh:/host-ssh:ro
      - ${USERPROFILE}/.ssh:/host-ssh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  jenkins-home:
    name: jenkins-home
