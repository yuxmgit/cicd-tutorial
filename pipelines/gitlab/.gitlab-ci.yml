# 放置位置：仓库根目录 .gitlab-ci.yml
stages: [check, deploy]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

frontend:
  stage: check
  image: node:20-alpine
  rules:
    - changes: ['demos/frontend/**']
  before_script:
    - cd demos/frontend
    - npm ci
  script:
    - npm run lint
    - npm run test:cov
    - npm run build
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [demos/frontend/node_modules]
  artifacts:
    paths: [demos/frontend/dist]
    expire_in: 1 week

backend:
  stage: check
  image: python:3.11-slim
  rules:
    - changes: ['demos/backend/**']
  script:
    - cd demos/backend
    - pip install -r requirements.txt
    - pytest
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]

deploy:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/apps/cicd-demo && sudo ./scripts/deploy.sh $CI_PIPELINE_IID"
