# 生产站点配置：放到服务器 /opt/apps/cicd-demo/shared/nginx/site.conf
# 由 docker-compose.prod.yml 挂载进前端容器的 /etc/nginx/conf.d/default.conf
# 上游 api:8000 是 compose 网络里的服务名，不要改成 127.0.0.1

server {
    listen 80;
    server_name _;

    # 健康检查路径放行（供负载均衡/监控探测）
    location = /healthz {
        proxy_pass http://api:8000/healthz;
        access_log off;
    }

    # 其余全部跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书：自签或 Let's Encrypt，放在 shared/certs 下挂载进来
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 静态资源根目录（由前端镜像提供）
    root  /usr/share/nginx/html;
    index index.html;

    # 上传大小：默认 1m 太小，头像/附件容易 413
    client_max_body_size 20m;

    # 压缩：2M 带宽下这是首屏速度的关键
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 自签证书阶段先不要开 HSTS；换成可信证书后再打开
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API 反代：保留 /api 前缀，直接交给后端
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # WebSocket（如果将来有）
    location /ws/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 入口文件不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
